<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流程圖生成器 | Flowchart Generator</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:         #0c0f1a;
  --surface:    #131826;
  --surface2:   #1a2033;
  --surface3:   #202840;
  --border:     #263050;
  --accent:     #4f9eff;
  --accent-dim: rgba(79,158,255,0.12);
  --accent-glow:rgba(79,158,255,0.25);
  --cyan:       #06d6a0;
  --amber:      #fbbf24;
  --red:        #f87171;
  --text:       #dce7f7;
  --text-dim:   #6b80a8;
  --font:       'DM Sans', sans-serif;
  --mono:       'JetBrains Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 14px;
}

/* ===== SIDEBAR ===== */
#sidebar {
  width: 256px;
  min-width: 256px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100%;
  transition: width 0.3s;
}

.sidebar-logo {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
}

.logo-mark {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 2px;
}

.logo-sub {
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.sidebar-section {
  padding: 12px 10px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 0 6px;
}

#history-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px;
}

.history-empty {
  padding: 24px 12px;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.8;
}

.history-item {
  padding: 9px 10px;
  border-radius: 7px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  margin-bottom: 3px;
  border: 1px solid transparent;
  position: relative;
}
.history-item:hover { background: var(--surface2); }
.history-item.active {
  background: var(--accent-dim);
  border-color: rgba(79,158,255,0.35);
}

.history-item-title {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-right: 22px;
}

.history-item-meta {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}

.history-del {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.15s, color 0.15s;
  line-height: 1;
  padding: 2px 4px;
}
.history-item:hover .history-del { opacity: 1; }
.history-del:hover { color: var(--red); }

.sidebar-footer {
  padding: 10px 8px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
}

/* ===== MAIN ===== */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ===== TOP BAR ===== */
#topbar {
  height: 50px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 10px;
  background: var(--surface);
  flex-shrink: 0;
}

#diagram-title {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 6px;
  font-family: var(--font);
  font-size: 13.5px;
  font-weight: 500;
  width: 240px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
#diagram-title:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
#diagram-title::placeholder { color: var(--text-dim); font-weight: 400; }

.topbar-right { margin-left: auto; display: flex; gap: 7px; align-items: center; }

/* ===== BUTTONS ===== */
.btn {
  padding: 7px 14px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  border: none;
  transition: all 0.18s;
  letter-spacing: 0.01em;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, #3b82f6, #4f9eff);
  color: #fff;
  box-shadow: 0 2px 12px rgba(59,130,246,0.35);
}
.btn-primary:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 18px rgba(59,130,246,0.5);
}

.btn-success {
  background: linear-gradient(135deg, #059669, #06d6a0);
  color: #fff;
  box-shadow: 0 2px 10px rgba(5,150,105,0.3);
}
.btn-success:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(5,150,105,0.5);
}

.btn-ghost {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-ghost:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}

.btn-icon {
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 13px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.18s;
  font-family: var(--font);
  font-weight: 500;
}
.btn-icon:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

.btn-sm {
  padding: 5px 11px;
  font-size: 12px;
  border-radius: 6px;
}

/* ===== INPUT AREA ===== */
#input-area {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

.tab-row {
  display: flex;
  gap: 4px;
  margin-bottom: 11px;
}

.tab-pill {
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-dim);
  transition: all 0.18s;
}
.tab-pill.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

#text-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 8px;
  font-family: var(--font);
  font-size: 13px;
  resize: none;
  height: 76px;
  line-height: 1.65;
  transition: border-color 0.2s, box-shadow 0.2s;
}
#text-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
#text-input::placeholder { color: var(--text-dim); }

#pdf-zone {
  width: 100%;
  height: 76px;
  border: 2px dashed var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 13px;
  color: var(--text-dim);
  gap: 8px;
  user-select: none;
}
#pdf-zone:hover, #pdf-zone.dragover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}
#pdf-zone.has-file {
  border-style: solid;
  border-color: var(--cyan);
  color: var(--cyan);
  background: rgba(6,214,160,0.07);
}

.action-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

.action-hint {
  font-size: 11.5px;
  color: var(--text-dim);
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 5px;
}

.dot-live {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ===== WORKSPACE ===== */
#workspace {
  flex: 1;
  display: flex;
  overflow: hidden;
}

.panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.panel + .panel { border-left: 1px solid var(--border); }

.panel-header {
  height: 38px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 8px;
  flex-shrink: 0;
}

.panel-title {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.panel-actions { margin-left: auto; display: flex; gap: 5px; }

#mermaid-code {
  flex: 1;
  background: var(--bg);
  border: none;
  color: #93c5fd;
  font-family: var(--mono);
  font-size: 12.5px;
  padding: 16px 18px;
  resize: none;
  line-height: 1.75;
  tab-size: 2;
  overflow-y: auto;
}
#mermaid-code:focus { outline: none; }
#mermaid-code::placeholder { color: var(--text-dim); font-family: var(--font); font-size: 13px; }

#preview-output {
  flex: 1;
  overflow: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
  background: var(--bg);
}

#preview-output svg {
  max-width: 100%;
  height: auto;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  width: 100%;
  gap: 12px;
  color: var(--text-dim);
  text-align: center;
  pointer-events: none;
}

.empty-icon { font-size: 52px; opacity: 0.25; }
.empty-label { font-size: 15px; color: var(--text-dim); font-weight: 500; }
.empty-hint { font-size: 12px; opacity: 0.55; line-height: 1.7; }

.error-box {
  background: rgba(248,113,113,0.08);
  border: 1px solid var(--red);
  color: var(--red);
  padding: 14px 18px;
  border-radius: 8px;
  font-size: 12px;
  font-family: var(--mono);
  max-width: 420px;
  line-height: 1.6;
}

/* ===== STATUS BAR ===== */
#statusbar {
  height: 26px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 16px;
  font-size: 11px;
  color: var(--text-dim);
  flex-shrink: 0;
}

.status-item { display: flex; align-items: center; gap: 5px; }

.indicator {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  flex-shrink: 0;
}
.indicator.busy {
  background: var(--amber);
  animation: pulse 1s infinite;
}

/* ===== LOADING ===== */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(12,15,26,0.82);
  backdrop-filter: blur(4px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  gap: 18px;
}

.spinner {
  width: 44px;
  height: 44px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-label { font-size: 14px; color: var(--text-dim); font-weight: 500; }

/* ===== MODAL ===== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(12,15,26,0.9);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
}

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 32px 36px;
  width: 500px;
  max-width: 92vw;
  box-shadow: 0 24px 60px rgba(0,0,0,0.5);
}

.modal-logo {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-logo::before {
  content: '';
  display: inline-block;
  width: 28px;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--cyan));
  border-radius: 2px;
}

.modal-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}

.modal-desc {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 28px;
  line-height: 1.7;
}

.form-group { margin-bottom: 18px; }

.form-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 7px;
}

.form-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 12px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.form-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.form-input::placeholder { color: var(--text-dim); font-family: var(--font); }

.modal-footer {
  margin-top: 28px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

/* ===== TOAST ===== */
#toast {
  position: fixed;
  bottom: 36px;
  right: 24px;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  z-index: 500;
  transform: translateY(20px);
  opacity: 0;
  transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
#toast.visible {
  transform: translateY(0);
  opacity: 1;
}
#toast.success { background: var(--cyan); color: #0a2a22; }
#toast.error   { background: var(--red);  color: #fff; }
#toast.info    { background: var(--accent); color: #fff; }

/* ===== UTIL ===== */
.hidden { display: none !important; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* splitter */
#splitter {
  width: 4px;
  background: var(--border);
  cursor: col-resize;
  transition: background 0.2s;
  flex-shrink: 0;
}
#splitter:hover, #splitter.dragging { background: var(--accent); }
</style>
</head>
<body>

<!-- ===== CONFIG MODAL ===== -->
<div class="modal-backdrop" id="config-modal">
  <div class="modal">
    <div class="modal-logo">Flowchart Generator</div>
    <div class="modal-title">初次設定 ⚙️</div>
    <div class="modal-desc">填入 API 憑證以啟用功能。所有資訊僅儲存於本機瀏覽器，不會傳送至任何第三方伺服器。</div>
    <div class="form-group">
      <label class="form-label">Gemini API Key</label>
      <input class="form-input" type="password" id="cfg-gemini" placeholder="AIzaSy...">
    </div>
    <div class="form-group">
      <label class="form-label">GitHub Personal Access Token（repo 權限）</label>
      <input class="form-input" type="password" id="cfg-token" placeholder="ghp_...">
    </div>
    <div class="form-group">
      <label class="form-label">GitHub Repo（用戶名/倉庫名）</label>
      <input class="form-input" type="text" id="cfg-repo" placeholder="jasonwong318/flowchart-generator">
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="saveConfig()">確認並開始使用 →</button>
    </div>
  </div>
</div>

<!-- ===== LOADING ===== -->
<div class="loading-overlay hidden" id="loading">
  <div class="spinner"></div>
  <div class="loading-label" id="loading-text">處理中...</div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast"></div>

<!-- ===== APP LAYOUT ===== -->
<div style="flex:1; display:flex; overflow:hidden;">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">FC Gen</div>
      <div class="logo-sub">流程圖生成器</div>
    </div>
    <div class="sidebar-section">
      <span class="sidebar-section-label">歷史記錄</span>
      <button class="btn btn-ghost btn-sm" onclick="newDiagram()" style="padding:3px 10px; font-size:11px;">＋ 新增</button>
    </div>
    <div id="history-list">
      <div class="history-empty">載入中...</div>
    </div>
    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-sm" style="flex:1; justify-content:center;" onclick="showConfig()">⚙ 設定</button>
      <button class="btn btn-ghost btn-sm" style="flex:1; justify-content:center;" onclick="refreshHistory()">⟳ 重整</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div id="main">

    <!-- TOP BAR -->
    <div id="topbar">
      <input id="diagram-title" type="text" placeholder="輸入流程圖名稱...">
      <div class="topbar-right">
        <button class="btn btn-success btn-sm" onclick="saveDiagram()">💾 儲存到 GitHub</button>
        <button class="btn btn-ghost btn-sm" onclick="exportSVG()">↓ SVG</button>
        <button class="btn btn-ghost btn-sm" onclick="exportPNG()">↓ PNG</button>
      </div>
    </div>

    <!-- INPUT AREA -->
    <div id="input-area">
      <div class="tab-row">
        <button class="tab-pill active" id="tab-text" onclick="switchTab('text')">📝 文字輸入</button>
        <button class="tab-pill" id="tab-pdf" onclick="switchTab('pdf')">📄 PDF 上傳</button>
      </div>
      <div id="text-panel">
        <textarea id="text-input" placeholder="描述業務流程，例如：採購申請由申請人填寫PR表，部門主管審批後，超過5萬元需CFO批准，財務部收到後安排付款並完成記帳..."></textarea>
      </div>
      <div id="pdf-panel" class="hidden">
        <div id="pdf-zone" onclick="document.getElementById('pdf-file').click()">
          <span style="font-size:20px;">📄</span>
          <span id="pdf-label">拖放 PDF 制度文件，或點擊此處上傳</span>
        </div>
        <input type="file" id="pdf-file" accept=".pdf" style="display:none">
      </div>
      <div class="action-row">
        <button class="btn btn-primary" id="generate-btn" onclick="generateFlowchart()">
          🤖 AI 生成流程圖
        </button>
        <div class="action-hint">
          <span class="dot-live"></span>
          <span>Gemini Flash · 自動偵測泳道</span>
        </div>
      </div>
    </div>

    <!-- WORKSPACE -->
    <div id="workspace">
      <!-- Code Panel -->
      <div class="panel" id="code-panel">
        <div class="panel-header">
          <span class="panel-title">Mermaid 代碼編輯器</span>
          <div class="panel-actions">
            <button class="btn-icon" onclick="copyCode()">複製</button>
            <button class="btn-icon" onclick="clearCode()">清除</button>
          </div>
        </div>
        <textarea id="mermaid-code" spellcheck="false" placeholder="AI 生成的 Mermaid 代碼將顯示於此&#10;您可直接在此修改，右側即時更新預覽"></textarea>
      </div>

      <!-- Splitter -->
      <div id="splitter" title="拖動調整寬度"></div>

      <!-- Preview Panel -->
      <div class="panel" id="preview-panel">
        <div class="panel-header">
          <span class="panel-title">即時預覽</span>
          <div class="panel-actions">
            <button class="btn-icon" onclick="zoomIn()">＋</button>
            <button class="btn-icon" onclick="zoomOut()">－</button>
            <button class="btn-icon" onclick="resetZoom()">重置</button>
          </div>
        </div>
        <div id="preview-output">
          <div class="empty-state">
            <div class="empty-icon">📊</div>
            <div class="empty-label">流程圖預覽</div>
            <div class="empty-hint">輸入文字描述或上傳 PDF 制度文件<br>點擊「AI 生成流程圖」開始</div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /main -->
</div>

<!-- STATUS BAR -->
<div id="statusbar">
  <div class="status-item">
    <span class="indicator" id="status-dot"></span>
    <span id="status-text">就緒</span>
  </div>
  <div class="status-item" id="record-count" style="color:var(--text-dim)"></div>
  <div style="margin-left:auto; opacity:0.4; font-size:10.5px;">Flowchart Generator v1.0 &nbsp;|&nbsp; Gemini Flash + Mermaid.js 10</div>
</div>

<script>
// ============================================================
// CONSTANTS & STATE
// ============================================================
const CONFIG_KEY  = 'fc_gen_config_v1';
const GITHUB_PATH = 'data/flowcharts.json';

let cfg           = {};
let flowcharts    = [];
let currentId     = null;
let renderTimer   = null;
let currentZoom   = 1;
let currentSha    = null;   // GitHub file sha for updates
let activeTab     = 'text';
let pdfFile       = null;

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  mermaid.initialize({
    startOnLoad: false,
    theme: 'dark',
    themeVariables: {
      primaryColor:         '#1a2a4a',
      primaryTextColor:     '#dce7f7',
      primaryBorderColor:   '#263050',
      lineColor:            '#4f9eff',
      secondaryColor:       '#131826',
      tertiaryColor:        '#0c0f1a',
      edgeLabelBackground:  '#1a2033',
      clusterBkg:           '#131826',
      clusterBorder:        '#263050',
      titleColor:           '#dce7f7',
      nodeTextColor:        '#dce7f7',
      fontFamily:           'DM Sans, sans-serif',
    },
    flowchart:  { htmlLabels: true, curve: 'basis', padding: 20 },
    securityLevel: 'loose',
  });

  setupCodeEditor();
  setupPDFZone();
  setupSplitter();
  loadConfigAndInit();
});

// ============================================================
// CONFIG
// ============================================================
function loadConfigAndInit() {
  const raw = localStorage.getItem(CONFIG_KEY);
  if (raw) {
    try { cfg = JSON.parse(raw); } catch { cfg = {}; }
  }
  if (cfg.geminiKey && cfg.githubToken && cfg.githubRepo) {
    document.getElementById('config-modal').classList.add('hidden');
    init();
  } else {
    // Pre-fill partial data
    if (cfg.geminiKey)   document.getElementById('cfg-gemini').value = cfg.geminiKey;
    if (cfg.githubToken) document.getElementById('cfg-token').value  = cfg.githubToken;
    if (cfg.githubRepo)  document.getElementById('cfg-repo').value   = cfg.githubRepo;
  }
}

function saveConfig() {
  const gemini = document.getElementById('cfg-gemini').value.trim();
  const token  = document.getElementById('cfg-token').value.trim();
  const repo   = document.getElementById('cfg-repo').value.trim();
  if (!gemini || !token || !repo) {
    toast('請填寫所有欄位', 'error');
    return;
  }
  cfg = { geminiKey: gemini, githubToken: token, githubRepo: repo };
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
  document.getElementById('config-modal').classList.add('hidden');
  init();
}

function showConfig() {
  document.getElementById('cfg-gemini').value = cfg.geminiKey  || '';
  document.getElementById('cfg-token').value  = cfg.githubToken || '';
  document.getElementById('cfg-repo').value   = cfg.githubRepo  || '';
  document.getElementById('config-modal').classList.remove('hidden');
}

// ============================================================
// MAIN INIT
// ============================================================
async function init() {
  setStatus('載入歷史記錄...', true);
  await loadFlowcharts();
  renderHistoryList();
  setStatus('就緒', false);
}

async function refreshHistory() {
  setStatus('重整中...', true);
  await loadFlowcharts();
  renderHistoryList();
  setStatus('就緒', false);
  toast('記錄已重整', 'info');
}

// ============================================================
// GITHUB API
// ============================================================
async function githubGet() {
  const url = `https://api.github.com/repos/${cfg.githubRepo}/contents/${GITHUB_PATH}`;
  const res = await fetch(url, {
    headers: {
      'Authorization': `Bearer ${cfg.githubToken}`,
      'Accept': 'application/vnd.github.v3+json',
    }
  });
  if (res.status === 404) return { data: [], sha: null };
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.message || `GitHub ${res.status}`);
  }
  const json = await res.json();
  const raw  = atob(json.content.replace(/\n/g, ''));
  // Handle UTF-8 properly
  const decoded = decodeURIComponent(
    raw.split('').map(c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')
  );
  return { data: JSON.parse(decoded), sha: json.sha };
}

async function githubPut(data, sha) {
  const url     = `https://api.github.com/repos/${cfg.githubRepo}/contents/${GITHUB_PATH}`;
  const json    = JSON.stringify(data, null, 2);
  // UTF-8 safe base64
  const encoded = btoa(encodeURIComponent(json).replace(/%([0-9A-F]{2})/g, (_, p1) =>
    String.fromCharCode(parseInt(p1, 16))
  ));
  const body = {
    message: `[FC Gen] ${new Date().toLocaleString('zh-HK')}`,
    content: encoded,
  };
  if (sha) body.sha = sha;
  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${cfg.githubToken}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.message || `GitHub PUT ${res.status}`);
  }
  const result = await res.json();
  return result.content?.sha;
}

async function loadFlowcharts() {
  try {
    const { data, sha } = await githubGet();
    flowcharts  = Array.isArray(data) ? data : [];
    currentSha  = sha;
    updateRecordCount();
  } catch(e) {
    console.error(e);
    toast('載入失敗：' + e.message, 'error');
    flowcharts = [];
  }
}

// ============================================================
// HISTORY LIST
// ============================================================
function renderHistoryList() {
  const list = document.getElementById('history-list');
  if (flowcharts.length === 0) {
    list.innerHTML = '<div class="history-empty">尚無記錄<br>輸入流程描述後點擊 AI 生成</div>';
    return;
  }
  const sorted = [...flowcharts].sort((a, b) =>
    new Date(b.updatedAt) - new Date(a.updatedAt)
  );
  list.innerHTML = sorted.map(fc => `
    <div class="history-item ${fc.id === currentId ? 'active' : ''}"
         onclick="loadFlowchart('${fc.id}')">
      <button class="history-del" onclick="event.stopPropagation(); confirmDelete('${fc.id}')">✕</button>
      <div class="history-item-title">${escHtml(fc.title)}</div>
      <div class="history-item-meta">${fmtDate(fc.updatedAt)}</div>
    </div>
  `).join('');
}

function loadFlowchart(id) {
  const fc = flowcharts.find(f => f.id === id);
  if (!fc) return;
  currentId = id;
  document.getElementById('diagram-title').value = fc.title || '';
  if (fc.inputText) document.getElementById('text-input').value = fc.inputText;
  const code = fc.mermaidCode || '';
  document.getElementById('mermaid-code').value = code;
  renderMermaid(code);
  renderHistoryList();
  currentZoom = 1;
}

function newDiagram() {
  currentId = null;
  document.getElementById('diagram-title').value = '';
  document.getElementById('text-input').value    = '';
  document.getElementById('mermaid-code').value  = '';
  document.getElementById('preview-output').innerHTML = emptyStateHTML();
  pdfFile = null;
  resetPdfZone();
  renderHistoryList();
  currentZoom = 1;
}

// ============================================================
// SAVE & DELETE
// ============================================================
async function saveDiagram() {
  const title = document.getElementById('diagram-title').value.trim();
  const code  = document.getElementById('mermaid-code').value.trim();
  if (!title) { toast('請輸入流程圖名稱', 'error'); return; }
  if (!code)  { toast('尚無 Mermaid 代碼可儲存', 'error'); return; }

  setStatus('儲存中...', true);
  showLoading('上傳至 GitHub...');

  try {
    // Re-fetch latest sha to avoid conflict
    const { sha } = await githubGet();
    const now = new Date().toISOString();

    if (currentId) {
      const idx = flowcharts.findIndex(f => f.id === currentId);
      if (idx >= 0) {
        flowcharts[idx] = {
          ...flowcharts[idx],
          title,
          mermaidCode: code,
          inputText: document.getElementById('text-input').value,
          updatedAt: now,
        };
      }
    } else {
      const newFc = {
        id:         'fc_' + Date.now(),
        title,
        mermaidCode: code,
        inputText:   document.getElementById('text-input').value,
        createdAt:   now,
        updatedAt:   now,
      };
      flowcharts.push(newFc);
      currentId = newFc.id;
    }

    currentSha = await githubPut(flowcharts, sha);
    renderHistoryList();
    updateRecordCount();
    toast('已儲存到 GitHub ✓', 'success');
    setStatus('就緒', false);
  } catch(e) {
    toast('儲存失敗：' + e.message, 'error');
    setStatus('錯誤', false);
  } finally {
    hideLoading();
  }
}

async function confirmDelete(id) {
  if (!confirm('確認刪除此流程圖？此操作不可撤銷。')) return;
  showLoading('刪除中...');
  try {
    const { sha } = await githubGet();
    flowcharts = flowcharts.filter(f => f.id !== id);
    currentSha = await githubPut(flowcharts, sha);
    if (currentId === id) newDiagram();
    renderHistoryList();
    updateRecordCount();
    toast('已刪除', 'info');
  } catch(e) {
    toast('刪除失敗：' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

// ============================================================
// AI GENERATION
// ============================================================
async function generateFlowchart() {
  if (activeTab === 'text') {
    const text = document.getElementById('text-input').value.trim();
    if (!text) { toast('請輸入流程描述', 'error'); return; }
    await callGemini({ text });
  } else {
    if (!pdfFile) { toast('請先上傳 PDF 文件', 'error'); return; }
    const base64 = await toBase64(pdfFile);
    await callGemini({ pdf: base64 });
  }
}

async function callGemini({ text, pdf }) {
  setStatus('調用 Gemini Flash...', true);
  showLoading('AI 正在分析業務流程...');

  const systemPrompt = `你是資深業務流程分析師，專長將業務制度轉換為清晰的 Mermaid.js 流程圖。

【輸出規則 — 必須嚴格遵守】
1. 只輸出純 Mermaid 代碼，不要有任何說明文字、標題或 markdown 代碼塊符號（不要 \`\`\`）
2. 所有節點文字、條件標籤、subgraph 標題必須使用繁體中文
3. 不要使用 "end" 作為節點 ID（Mermaid 保留字）

【流程圖要求】
• 方向：flowchart TD（預設由上至下）；涉及多部門時可用 LR（由左至右）
• 節點類型：
  - 一般步驟   → [步驟名稱]
  - 決策/判斷  → {判斷條件？}
  - 開始/結束  → ([開始]) / ([結束])
  - 文件/表單  → [/文件名稱/]
  - 系統操作   → [[系統名稱]]
• 泳道：涉及2個或以上部門/角色時，必須用 subgraph 劃分
• 審批節點：明確標示通過／拒絕兩條分支
• 連線標籤：重要條件用 -- 條件 --> 標示
• 確保代碼語法正確、完整可運行`;

  const parts = pdf
    ? [
        { inline_data: { mime_type: 'application/pdf', data: pdf } },
        { text: systemPrompt + '\n\n請分析以上 PDF 文件中的業務流程，生成完整流程圖。' },
      ]
    : [
        { text: systemPrompt + '\n\n【業務流程描述】\n' + text },
      ];

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${cfg.geminiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts }] }),
      }
    );
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.error?.message || `Gemini ${res.status}`);
    }
    const data = await res.json();
    let raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const code = cleanMermaid(raw);

    document.getElementById('mermaid-code').value = code;
    await renderMermaid(code);

    // Auto-suggest title if blank
    if (!document.getElementById('diagram-title').value.trim()) {
      autoTitle(code, text);
    }

    toast('流程圖生成成功 ✓', 'success');
    setStatus('生成完成', false);
  } catch(e) {
    toast('生成失敗：' + e.message, 'error');
    setStatus('錯誤', false);
    console.error(e);
  } finally {
    hideLoading();
  }
}

function cleanMermaid(raw) {
  let s = raw.trim();
  // Remove markdown fences
  s = s.replace(/^```(?:mermaid)?\s*/i, '').replace(/\s*```\s*$/i, '').trim();
  return s;
}

function autoTitle(code, inputText) {
  // Try to extract a subgraph name or use first sentence of text
  const sg = code.match(/subgraph\s+([^\n{[]+)/);
  if (sg) {
    document.getElementById('diagram-title').value = sg[1].trim() + '流程圖';
    return;
  }
  if (inputText) {
    const first = inputText.split(/[，。,.\n]/)[0].trim().slice(0, 20);
    if (first) {
      document.getElementById('diagram-title').value = first + '流程圖';
      return;
    }
  }
  document.getElementById('diagram-title').value = '業務流程圖_' + new Date().toLocaleDateString('zh-HK').replace(/\//g, '');
}

// ============================================================
// MERMAID RENDER
// ============================================================
async function renderMermaid(code) {
  const out = document.getElementById('preview-output');
  if (!code || !code.trim()) {
    out.innerHTML = emptyStateHTML('修改代碼後自動更新預覽');
    return;
  }
  try {
    const uid = 'fc_svg_' + Date.now();
    const { svg } = await mermaid.render(uid, code);
    out.innerHTML = `<div id="svg-wrap" style="transform-origin:top center; transform:scale(${currentZoom}); transition:transform 0.2s;">${svg}</div>`;
    const svgEl = out.querySelector('svg');
    if (svgEl) {
      svgEl.style.maxWidth  = '100%';
      svgEl.style.height    = 'auto';
    }
  } catch(e) {
    out.innerHTML = `<div class="error-box">⚠ Mermaid 語法錯誤<br><br>${escHtml(String(e.message || e))}</div>`;
  }
}

function setupCodeEditor() {
  const ta = document.getElementById('mermaid-code');
  ta.addEventListener('input', () => {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => renderMermaid(ta.value), 700);
  });
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = s + 2;
    }
  });
}

// ============================================================
// PDF
// ============================================================
function setupPDFZone() {
  const zone  = document.getElementById('pdf-zone');
  const input = document.getElementById('pdf-file');

  zone.addEventListener('dragover',  (e) => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', ()  => zone.classList.remove('dragover'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f?.type === 'application/pdf') setPDFFile(f);
    else toast('請上傳 PDF 格式文件', 'error');
  });

  input.addEventListener('change', () => {
    if (input.files[0]) setPDFFile(input.files[0]);
  });
}

function setPDFFile(file) {
  pdfFile = file;
  const zone  = document.getElementById('pdf-zone');
  const label = document.getElementById('pdf-label');
  zone.classList.add('has-file');
  label.textContent = `✓ ${file.name}  （${(file.size / 1024).toFixed(1)} KB）`;
}

function resetPdfZone() {
  document.getElementById('pdf-zone').classList.remove('has-file');
  document.getElementById('pdf-label').textContent = '拖放 PDF 制度文件，或點擊此處上傳';
  document.getElementById('pdf-file').value = '';
}

// ============================================================
// TABS
// ============================================================
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-text').classList.toggle('active', tab === 'text');
  document.getElementById('tab-pdf').classList.toggle('active',  tab === 'pdf');
  document.getElementById('text-panel').classList.toggle('hidden', tab !== 'text');
  document.getElementById('pdf-panel').classList.toggle('hidden',  tab !== 'pdf');
}

// ============================================================
// ZOOM
// ============================================================
function zoomIn()   { setZoom(currentZoom + 0.1); }
function zoomOut()  { setZoom(currentZoom - 0.1); }
function resetZoom(){ setZoom(1); }

function setZoom(z) {
  currentZoom = Math.max(0.3, Math.min(3, z));
  const wrap = document.getElementById('svg-wrap');
  if (wrap) wrap.style.transform = `scale(${currentZoom})`;
}

// ============================================================
// EXPORT
// ============================================================
function copyCode() {
  const code = document.getElementById('mermaid-code').value;
  if (!code) { toast('尚無代碼', 'error'); return; }
  navigator.clipboard.writeText(code).then(() => toast('代碼已複製 ✓', 'success'));
}

function clearCode() {
  if (!document.getElementById('mermaid-code').value) return;
  if (!confirm('清除目前代碼？')) return;
  document.getElementById('mermaid-code').value = '';
  document.getElementById('preview-output').innerHTML = emptyStateHTML();
}

function exportSVG() {
  const svg = document.querySelector('#preview-output svg');
  if (!svg) { toast('尚無流程圖可匯出', 'error'); return; }
  const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml;charset=utf-8' });
  dl(URL.createObjectURL(blob), exportName() + '.svg');
  toast('SVG 已下載', 'success');
}

function exportPNG() {
  const svg = document.querySelector('#preview-output svg');
  if (!svg) { toast('尚無流程圖可匯出', 'error'); return; }
  const scale  = 2.5;
  const bb     = svg.getBoundingClientRect();
  const canvas = document.createElement('canvas');
  canvas.width  = bb.width  * scale;
  canvas.height = bb.height * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = '#0c0f1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const img  = new Image();
  const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  img.onload = () => {
    ctx.drawImage(img, 0, 0);
    dl(canvas.toDataURL('image/png'), exportName() + '.png');
    URL.revokeObjectURL(url);
    toast('PNG 已下載', 'success');
  };
  img.src = url;
}

function exportName() {
  return (document.getElementById('diagram-title').value || '流程圖')
    .replace(/[\/\\:*?"<>|]/g, '_').slice(0, 60);
}

function dl(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
}

// ============================================================
// SPLITTER (resize panels)
// ============================================================
function setupSplitter() {
  const sp  = document.getElementById('splitter');
  const ws  = document.getElementById('workspace');
  const cp  = document.getElementById('code-panel');
  const pp  = document.getElementById('preview-panel');
  let dragging = false, startX = 0, startW = 0;

  sp.addEventListener('mousedown', (e) => {
    dragging = true;
    startX   = e.clientX;
    startW   = cp.getBoundingClientRect().width;
    sp.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const total = ws.getBoundingClientRect().width - 4; // minus splitter
    const newW  = Math.max(200, Math.min(total - 200, startW + (e.clientX - startX)));
    cp.style.flex = 'none';
    cp.style.width = newW + 'px';
    pp.style.flex  = '1';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    sp.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}

// ============================================================
// UI HELPERS
// ============================================================
function showLoading(msg = '處理中...') {
  document.getElementById('loading-text').textContent = msg;
  document.getElementById('loading').classList.remove('hidden');
}

function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}

function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = `visible ${type}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 2800);
}

function setStatus(text, busy = false) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className    = busy ? 'indicator busy' : 'indicator';
}

function updateRecordCount() {
  document.getElementById('record-count').textContent =
    flowcharts.length ? `共 ${flowcharts.length} 個流程圖` : '';
}

function emptyStateHTML(hint = '輸入文字描述或上傳 PDF 制度文件<br>點擊「AI 生成流程圖」開始') {
  return `<div class="empty-state">
    <div class="empty-icon">📊</div>
    <div class="empty-label">流程圖預覽</div>
    <div class="empty-hint">${hint}</div>
  </div>`;
}

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('zh-HK', {
    month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'
  });
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload  = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
</script>
